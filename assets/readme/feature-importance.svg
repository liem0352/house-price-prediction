<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-labelledby="fiTitle fiDesc">
  <title id="fiTitle">特征重要性 — 影响房价的关键驱动因子</title>
  <desc id="fiDesc">基于全连接神经网络训练后得到的特征重要性横向条形图,展示 Top 10 影响房价的关键特征。OverallQual、GrLivArea、GarageCars 为砖红高亮(Top 3),其余为深蓝。横轴为相对重要性 0 到 1。</desc>
  <defs>
    <style>
      .bg { fill: #FAFAF7; }
      .ink { fill: #1A1A1A; }
      .mute { fill: #8B8680; }
      .primary { fill: #2E5C8A; }
      .accent { fill: #C44536; }
      .frame { fill: none; stroke: #E5E2DC; stroke-width: 1; }
      .axis { stroke: #8B8680; stroke-width: 1; }
      .grid { stroke: #EDE9E2; stroke-width: 1; stroke-dasharray: 2 4; }
      .label-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .label-sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1200" height="320" rx="20" ry="20"/>

  <!-- Header -->
  <g transform="translate(56 38)">
    <text class="label-mono mute" x="0" y="0" font-size="11" letter-spacing="1.5">FEATURE IMPORTANCE · TOP 10</text>
    <text class="label-sans ink" x="0" y="28" font-size="22" font-weight="700">影响房价的关键驱动因子</text>
    <text class="label-sans mute" x="0" y="50" font-size="13">神经网络训练后,各特征对房价预测的相对贡献</text>
  </g>

  <!-- Top 3 legend tag -->
  <g transform="translate(1010 38)">
    <rect x="0" y="0" width="134" height="22" fill="#FAFAF7" stroke="#C44536" stroke-width="1" rx="4" ry="4"/>
    <circle cx="14" cy="11" r="4" fill="#C44536"/>
    <text class="label-mono accent" x="26" y="15" font-size="11" font-weight="600">Top 3 高亮</text>
  </g>

  <!-- Horizontal bar chart area: 10 rows, each 17px height, gap 4px -->
  <!-- Row baseline y: starts at 110, each row +21 -->
  <g transform="translate(56 110)">
    <!-- X axis grid (vertical) -->
    <line class="grid" x1="280" y1="0" x2="280" y2="200"/>
    <line class="grid" x1="440" y1="0" x2="440" y2="200"/>
    <line class="grid" x1="600" y1="0" x2="600" y2="200"/>
    <line class="grid" x1="760" y1="0" x2="760" y2="200"/>
    <line class="axis" x1="280" y1="200" x2="920" y2="200"/>

    <!-- X axis ticks -->
    <g class="label-mono mute" font-size="10" text-anchor="middle">
      <text x="280" y="216">0</text>
      <text x="440" y="216">0.25</text>
      <text x="600" y="216">0.50</text>
      <text x="760" y="216">0.75</text>
      <text x="920" y="216">1.00</text>
    </g>
    <text class="label-sans mute" x="600" y="232" font-size="11" text-anchor="middle">相对重要性 (Normalized)</text>

    <!-- Row 1: OverallQual - 0.92 (accent) -->
    <text class="label-mono ink" x="270" y="11" font-size="11" text-anchor="end" font-weight="600">OverallQual</text>
    <rect x="280" y="3" width="590" height="11" fill="#C44536" rx="2" ry="2"/>
    <text class="label-mono accent" x="878" y="11" font-size="10" font-weight="600">0.92</text>

    <!-- Row 2: GrLivArea - 0.78 (accent) -->
    <text class="label-mono ink" x="270" y="32" font-size="11" text-anchor="end" font-weight="600">GrLivArea</text>
    <rect x="280" y="24" width="500" height="11" fill="#C44536" rx="2" ry="2"/>
    <text class="label-mono accent" x="788" y="32" font-size="10" font-weight="600">0.78</text>

    <!-- Row 3: GarageCars - 0.65 (accent) -->
    <text class="label-mono ink" x="270" y="53" font-size="11" text-anchor="end" font-weight="600">GarageCars</text>
    <rect x="280" y="45" width="416" height="11" fill="#C44536" rx="2" ry="2"/>
    <text class="label-mono accent" x="704" y="53" font-size="10" font-weight="600">0.65</text>

    <!-- Row 4: TotalBsmtSF - 0.58 (primary) -->
    <text class="label-mono ink" x="270" y="74" font-size="11" text-anchor="end">TotalBsmtSF</text>
    <rect x="280" y="66" width="371" height="11" fill="#2E5C8A" rx="2" ry="2"/>
    <text class="label-mono primary" x="659" y="74" font-size="10">0.58</text>

    <!-- Row 5: GarageArea - 0.52 (primary) -->
    <text class="label-mono ink" x="270" y="95" font-size="11" text-anchor="end">GarageArea</text>
    <rect x="280" y="87" width="333" height="11" fill="#2E5C8A" rx="2" ry="2"/>
    <text class="label-mono primary" x="621" y="95" font-size="10">0.52</text>

    <!-- Row 6: 1stFlrSF - 0.46 (primary) -->
    <text class="label-mono ink" x="270" y="116" font-size="11" text-anchor="end">1stFlrSF</text>
    <rect x="280" y="108" width="294" height="11" fill="#2E5C8A" rx="2" ry="2"/>
    <text class="label-mono primary" x="582" y="116" font-size="10">0.46</text>

    <!-- Row 7: FullBath - 0.41 (primary) -->
    <text class="label-mono ink" x="270" y="137" font-size="11" text-anchor="end">FullBath</text>
    <rect x="280" y="129" width="262" height="11" fill="#2E5C8A" rx="2" ry="2"/>
    <text class="label-mono primary" x="550" y="137" font-size="10">0.41</text>

    <!-- Row 8: TotRmsAbvGrd - 0.37 (primary) -->
    <text class="label-mono ink" x="270" y="158" font-size="11" text-anchor="end">TotRmsAbvGrd</text>
    <rect x="280" y="150" width="237" height="11" fill="#2E5C8A" rx="2" ry="2"/>
    <text class="label-mono primary" x="525" y="158" font-size="10">0.37</text>

    <!-- Row 9: YearBuilt - 0.33 (primary) -->
    <text class="label-mono ink" x="270" y="179" font-size="11" text-anchor="end">YearBuilt</text>
    <rect x="280" y="171" width="211" height="11" fill="#2E5C8A" rx="2" ry="2"/>
    <text class="label-mono primary" x="499" y="179" font-size="10">0.33</text>

    <!-- Row 10: YearRemodAdd - 0.29 (primary) -->
    <text class="label-mono ink" x="270" y="200" font-size="11" text-anchor="end">YearRemodAdd</text>
    <rect x="280" y="192" width="186" height="11" fill="#2E5C8A" rx="2" ry="2"/>
    <text class="label-mono primary" x="474" y="200" font-size="10">0.29</text>
  </g>

  <!-- Bottom note -->
  <text class="label-mono mute" x="56" y="308" font-size="10">基于神经网络权重归一化估算 · 实际值见 notebook 训练输出</text>
  <text class="label-mono mute" x="1144" y="308" font-size="10" text-anchor="end">Top 10 of 81 features</text>
</svg>
