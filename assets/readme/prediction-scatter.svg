<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-labelledby="psTitle psDesc">
  <title id="psTitle">预测-真实散点图 — 回归贴合度的直观证据</title>
  <desc id="psDesc">预测值与真实值的散点图。横轴为真实房价(归一化 0-1),纵轴为模型预测值(归一化 0-1)。深蓝实线为理想对角线 y=x,砖红散点围绕对角线分布。右上角标注 R² ≈ 0.89,表明模型解释力较强。左下角注解解释贴近对角线的含义。</desc>
  <defs>
    <style>
      .bg { fill: #FAFAF7; }
      .ink { fill: #1A1A1A; }
      .mute { fill: #8B8680; }
      .primary { fill: #2E5C8A; }
      .accent { fill: #C44536; }
      .frame { fill: #FFFFFF; stroke: #E5E2DC; stroke-width: 1; }
      .axis { stroke: #8B8680; stroke-width: 1; }
      .grid { stroke: #EDE9E2; stroke-width: 1; stroke-dasharray: 2 4; }
      .diag { stroke: #2E5C8A; stroke-width: 2; }
      .label-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .label-sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1200" height="320" rx="20" ry="20"/>

  <!-- Header -->
  <g transform="translate(56 38)">
    <text class="label-mono mute" x="0" y="0" font-size="11" letter-spacing="1.5">PREDICTED vs TRUE · SCATTER</text>
    <text class="label-sans ink" x="0" y="28" font-size="22" font-weight="700">回归贴合度的直观证据</text>
    <text class="label-sans mute" x="0" y="50" font-size="13">散点越贴近对角线 y=x,模型回归质量越高</text>
  </g>

  <!-- R² badge top-right -->
  <g transform="translate(1050 38)">
    <rect x="0" y="0" width="94" height="26" fill="#FAFAF7" stroke="#2E5C8A" stroke-width="1.2" rx="4" ry="4"/>
    <text class="label-mono primary" x="47" y="17" font-size="13" text-anchor="middle" font-weight="600">R² ≈ 0.89</text>
  </g>

  <!-- Scatter plot area -->
  <g transform="translate(56 110)">
    <rect class="frame" x="0" y="0" width="1088" height="180" rx="8" ry="8"/>

    <!-- Grid lines (horizontal) -->
    <line class="grid" x1="60" y1="36" x2="1048" y2="36"/>
    <line class="grid" x1="60" y1="90" x2="1048" y2="90"/>
    <line class="grid" x1="60" y1="144" x2="1048" y2="144"/>

    <!-- Grid lines (vertical) -->
    <line class="grid" x1="316" y1="20" x2="316" y2="160"/>
    <line class="grid" x1="572" y1="20" x2="572" y2="160"/>
    <line class="grid" x1="828" y1="20" x2="828" y2="160"/>

    <!-- Axes -->
    <line class="axis" x1="60" y1="160" x2="1048" y2="160"/>
    <line class="axis" x1="60" y1="20" x2="60" y2="160"/>

    <!-- Ideal diagonal y=x (from 60,160 to 1048,20) -->
    <line class="diag" x1="60" y1="160" x2="1048" y2="20"/>

    <!-- Scatter: brick-red points around diagonal with realistic spread (more points for larger plot) -->
    <g fill="#C44536" fill-opacity="0.72">
      <!-- Lower range cluster -->
      <circle cx="78" cy="154" r="3.2"/>
      <circle cx="92" cy="148" r="3.2"/>
      <circle cx="106" cy="158" r="3.2"/>
      <circle cx="120" cy="142" r="3.2"/>
      <circle cx="134" cy="150" r="3.2"/>
      <circle cx="148" cy="136" r="3.2"/>
      <circle cx="162" cy="144" r="3.2"/>
      <circle cx="176" cy="128" r="3.2"/>
      <circle cx="190" cy="138" r="3.2"/>
      <circle cx="204" cy="122" r="3.2"/>
      <!-- Low-mid range -->
      <circle cx="218" cy="132" r="3.2"/>
      <circle cx="232" cy="116" r="3.2"/>
      <circle cx="246" cy="126" r="3.2"/>
      <circle cx="260" cy="110" r="3.2"/>
      <circle cx="274" cy="120" r="3.2"/>
      <circle cx="288" cy="104" r="3.2"/>
      <circle cx="302" cy="114" r="3.2"/>
      <circle cx="316" cy="98" r="3.2"/>
      <circle cx="330" cy="108" r="3.2"/>
      <circle cx="344" cy="92" r="3.2"/>
      <!-- Mid range -->
      <circle cx="358" cy="102" r="3.2"/>
      <circle cx="372" cy="86" r="3.2"/>
      <circle cx="386" cy="96" r="3.2"/>
      <circle cx="400" cy="80" r="3.2"/>
      <circle cx="414" cy="90" r="3.2"/>
      <circle cx="428" cy="74" r="3.2"/>
      <circle cx="442" cy="84" r="3.2"/>
      <circle cx="456" cy="68" r="3.2"/>
      <circle cx="470" cy="78" r="3.2"/>
      <circle cx="484" cy="62" r="3.2"/>
      <!-- Mid-high range -->
      <circle cx="498" cy="72" r="3.2"/>
      <circle cx="512" cy="56" r="3.2"/>
      <circle cx="526" cy="66" r="3.2"/>
      <circle cx="540" cy="50" r="3.2"/>
      <circle cx="554" cy="60" r="3.2"/>
      <circle cx="568" cy="44" r="3.2"/>
      <circle cx="582" cy="54" r="3.2"/>
      <circle cx="596" cy="38" r="3.2"/>
      <circle cx="610" cy="48" r="3.2"/>
      <circle cx="624" cy="32" r="3.2"/>
      <!-- High range -->
      <circle cx="638" cy="42" r="3.2"/>
      <circle cx="652" cy="26" r="3.2"/>
      <circle cx="666" cy="36" r="3.2"/>
      <circle cx="680" cy="30" r="3.2"/>
      <circle cx="694" cy="40" r="3.2"/>
      <circle cx="708" cy="32" r="3.2"/>
      <circle cx="722" cy="42" r="3.2"/>
      <circle cx="736" cy="34" r="3.2"/>
      <circle cx="750" cy="44" r="3.2"/>
      <circle cx="764" cy="36" r="3.2"/>
      <!-- Top range -->
      <circle cx="778" cy="46" r="3.2"/>
      <circle cx="792" cy="38" r="3.2"/>
      <circle cx="806" cy="48" r="3.2"/>
      <circle cx="820" cy="40" r="3.2"/>
      <circle cx="834" cy="50" r="3.2"/>
      <circle cx="848" cy="42" r="3.2"/>
      <circle cx="862" cy="52" r="3.2"/>
      <circle cx="876" cy="44" r="3.2"/>
      <circle cx="890" cy="54" r="3.2"/>
      <circle cx="904" cy="46" r="3.2"/>
      <!-- Off-diagonal scatter (residual noise) -->
      <circle cx="240" cy="156" r="3.2"/>
      <circle cx="380" cy="142" r="3.2"/>
      <circle cx="520" cy="124" r="3.2"/>
      <circle cx="660" cy="106" r="3.2"/>
      <circle cx="800" cy="88" r="3.2"/>
      <circle cx="180" cy="100" r="3.2"/>
      <circle cx="320" cy="80" r="3.2"/>
      <circle cx="460" cy="60" r="3.2"/>
      <circle cx="600" cy="40" r="3.2"/>
      <circle cx="740" cy="34" r="3.2"/>
      <circle cx="880" cy="42" r="3.2"/>
      <circle cx="940" cy="52" r="3.2"/>
      <circle cx="990" cy="48" r="3.2"/>
    </g>

    <!-- X-axis tick labels -->
    <g class="label-mono mute" font-size="10" text-anchor="middle">
      <text x="60" y="176">0.0</text>
      <text x="316" y="176">0.25</text>
      <text x="572" y="176">0.50</text>
      <text x="828" y="176">0.75</text>
      <text x="1048" y="176">1.0</text>
    </g>

    <!-- Y-axis tick labels -->
    <g class="label-mono mute" font-size="10" text-anchor="end">
      <text x="54" y="164">0.0</text>
      <text x="54" y="148">0.25</text>
      <text x="54" y="94">0.50</text>
      <text x="54" y="40">0.75</text>
      <text x="54" y="24">1.0</text>
    </g>

    <!-- Axis titles -->
    <text class="label-sans mute" x="554" y="196" font-size="12" text-anchor="middle">真实房价 (True, normalized)</text>
    <text class="label-sans mute" x="18" y="90" font-size="12" text-anchor="middle" transform="rotate(-90 18 90)">预测房价 (Predicted, normalized)</text>

    <!-- Diagonal label -->
    <text class="label-mono primary" x="1010" y="34" font-size="10" text-anchor="end" font-weight="600">y = x</text>
  </g>

  <!-- Bottom note -->
  <text class="label-mono mute" x="56" y="308" font-size="10">实际产物: figures/pred_vs_true.png · 此处为示意图,基于 R² ≈ 0.89 的典型形态</text>
</svg>
