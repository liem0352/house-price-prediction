<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">房价预测神经网络 — 项目横幅</title>
  <desc id="heroDesc">房价预测神经网络 README 横幅。左侧为标题块:TensorFlow/Keras 全连接回归模型,Kaggle House Prices 数据集 1460×81,Dense+Dropout+早停,MSE/RMSE/R² 评估。右侧为预测-真实散点图,砖红散点围绕深蓝对角线 y=x 分布,右上角标注 R² ≈ 0.89。</desc>
  <defs>
    <style>
      .bg { fill: #FAFAF7; }
      .ink { fill: #1A1A1A; }
      .mute { fill: #8B8680; }
      .primary { fill: #2E5C8A; }
      .accent { fill: #C44536; }
      .frame { fill: none; stroke: #E5E2DC; stroke-width: 1; }
      .axis { stroke: #8B8680; stroke-width: 1; }
      .grid { stroke: #EDE9E2; stroke-width: 1; stroke-dasharray: 2 4; }
      .diag { stroke: #2E5C8A; stroke-width: 2; }
      .label-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .label-sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .label-serif { font-family: Georgia, "Times New Roman", serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1200" height="360" rx="26" ry="26"/>

  <!-- Left: title block -->
  <g transform="translate(56 52)">
    <text class="label-mono mute" x="0" y="18" font-size="13" letter-spacing="2.5">REGRESSION · NEURAL NETWORK</text>
    <text class="label-sans ink" x="0" y="74" font-size="46" font-weight="700">房价预测神经网络</text>
    <line x1="0" y1="92" x2="64" y2="92" stroke="#C44536" stroke-width="3"/>
    <text class="label-sans mute" x="0" y="120" font-size="17">TensorFlow · Keras · Kaggle House Prices</text>
    <text class="label-mono mute" x="0" y="146" font-size="13">1460 行 × 81 列 · Dense + Dropout · 早停</text>
    <text class="label-mono mute" x="0" y="168" font-size="13">评估: MSE / RMSE / R²</text>
    <text class="label-mono primary" x="0" y="208" font-size="13" letter-spacing="1">→ house_price_model.keras</text>
  </g>

  <!-- Right: pred-vs-true scatter plot -->
  <g transform="translate(740 48)">
    <rect class="frame" x="0" y="0" width="404" height="264" rx="8" ry="8"/>
    <text class="label-mono mute" x="14" y="22" font-size="11" letter-spacing="1.5">PREDICTED vs TRUE</text>

    <!-- Grid -->
    <line class="grid" x1="50" y1="118" x2="384" y2="118"/>
    <line class="grid" x1="217" y1="34" x2="217" y2="216"/>
    <line class="grid" x1="133" y1="34" x2="133" y2="216"/>
    <line class="grid" x1="301" y1="34" x2="301" y2="216"/>
    <line class="grid" x1="50" y1="156" x2="384" y2="156"/>
    <line class="grid" x1="50" y1="76" x2="384" y2="76"/>

    <!-- Axes -->
    <line class="axis" x1="50" y1="216" x2="384" y2="216"/>
    <line class="axis" x1="50" y1="34" x2="50" y2="216"/>

    <!-- Ideal diagonal y=x -->
    <line class="diag" x1="50" y1="216" x2="384" y2="34"/>

    <!-- Scatter: brick-red points around diagonal with realistic spread -->
    <g fill="#C44536" fill-opacity="0.78">
      <circle cx="66" cy="208" r="3"/>
      <circle cx="78" cy="194" r="3"/>
      <circle cx="92" cy="201" r="3"/>
      <circle cx="103" cy="183" r="3"/>
      <circle cx="115" cy="190" r="3"/>
      <circle cx="127" cy="171" r="3"/>
      <circle cx="138" cy="178" r="3"/>
      <circle cx="150" cy="159" r="3"/>
      <circle cx="161" cy="166" r="3"/>
      <circle cx="173" cy="148" r="3"/>
      <circle cx="184" cy="155" r="3"/>
      <circle cx="196" cy="138" r="3"/>
      <circle cx="207" cy="144" r="3"/>
      <circle cx="218" cy="126" r="3"/>
      <circle cx="229" cy="133" r="3"/>
      <circle cx="240" cy="115" r="3"/>
      <circle cx="251" cy="122" r="3"/>
      <circle cx="262" cy="103" r="3"/>
      <circle cx="273" cy="111" r="3"/>
      <circle cx="284" cy="92" r="3"/>
      <circle cx="295" cy="99" r="3"/>
      <circle cx="306" cy="80" r="3"/>
      <circle cx="317" cy="87" r="3"/>
      <circle cx="328" cy="69" r="3"/>
      <circle cx="339" cy="76" r="3"/>
      <circle cx="350" cy="57" r="3"/>
      <circle cx="361" cy="64" r="3"/>
      <circle cx="372" cy="46" r="3"/>
      <circle cx="383" cy="52" r="3"/>
      <circle cx="88" cy="172" r="3"/>
      <circle cx="146" cy="141" r="3"/>
      <circle cx="204" cy="109" r="3"/>
      <circle cx="262" cy="78" r="3"/>
      <circle cx="320" cy="47" r="3"/>
      <circle cx="109" cy="208" r="3"/>
      <circle cx="167" cy="177" r="3"/>
      <circle cx="225" cy="146" r="3"/>
      <circle cx="283" cy="115" r="3"/>
      <circle cx="341" cy="83" r="3"/>
    </g>

    <!-- X-axis tick labels -->
    <g class="label-mono mute" font-size="10" text-anchor="middle">
      <text x="50" y="232">0</text>
      <text x="133" y="232">0.25</text>
      <text x="217" y="232">0.5</text>
      <text x="301" y="232">0.75</text>
      <text x="384" y="232">1.0</text>
    </g>

    <!-- Y-axis tick labels -->
    <g class="label-mono mute" font-size="10" text-anchor="end">
      <text x="44" y="220">0</text>
      <text x="44" y="160">0.25</text>
      <text x="44" y="122">0.5</text>
      <text x="44" y="80">0.75</text>
      <text x="44" y="38">1.0</text>
    </g>

    <!-- Axis titles -->
    <text class="label-sans mute" x="217" y="252" font-size="12" text-anchor="middle">真实值 (True)</text>
    <text class="label-sans mute" x="14" y="125" font-size="12" text-anchor="middle" transform="rotate(-90 14 125)">预测值 (Predicted)</text>

    <!-- R² annotation badge -->
    <g transform="translate(296 38)">
      <rect x="0" y="0" width="80" height="24" fill="#FAFAF7" stroke="#2E5C8A" stroke-width="1.2" rx="4" ry="4"/>
      <text class="label-mono primary" x="40" y="16" font-size="12" text-anchor="middle" font-weight="600">R² ≈ 0.89</text>
    </g>
  </g>

  <!-- Bottom meta line -->
  <text class="label-mono mute" x="56" y="335" font-size="12">TF 2.21 · sklearn 1.8 · 作者 liem</text>
</svg>
