<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">房价预测神经网络 — 项目横幅</title>
  <desc id="heroDesc">房价预测神经网络项目 README 横幅。左侧为标题块,标注 TensorFlow/Keras 全连接回归模型与 Kaggle House Prices 数据集规模 1460×81;右侧为预测-真实散点图,砖红散点围绕深蓝对角线 y=x 分布,右上角标注 R² ≈ 0.89。</desc>
  <defs>
    <style>
      .bg { fill: #FAFAF7; }
      .ink { fill: #1A1A1A; }
      .mute { fill: #8B8680; }
      .primary { fill: #2E5C8A; }
      .accent { fill: #C44536; }
      .frame { fill: none; stroke: #E5E2DC; stroke-width: 1; }
      .axis { stroke: #8B8680; stroke-width: 1; }
      .grid { stroke: #EDE9E2; stroke-width: 1; stroke-dasharray: 2 4; }
      .diag { stroke: #2E5C8A; stroke-width: 2; }
      .label-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .label-sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1200" height="360" rx="26" ry="26"/>

  <!-- Left: title block -->
  <g transform="translate(56 48)">
    <text class="label-mono mute" x="0" y="20" font-size="14" letter-spacing="2">REGRESSION · NEURAL NETWORK</text>
    <text class="label-sans ink" x="0" y="72" font-size="44" font-weight="700">房价预测神经网络</text>
    <text class="label-sans mute" x="0" y="104" font-size="18">TensorFlow · Keras · Kaggle House Prices · 1460×81</text>
    <text class="label-mono mute" x="0" y="128" font-size="14">Dense+Dropout · 早停 · MSE/RMSE/R²</text>
    <line x1="0" y1="148" x2="120" y2="148" stroke="#2E5C8A" stroke-width="2"/>
  </g>

  <!-- Right: pred-vs-true scatter plot -->
  <g transform="translate(760 48)">
    <rect class="frame" x="0" y="0" width="384" height="264" rx="8" ry="8"/>
    <line class="grid" x1="50" y1="118" x2="364" y2="118"/>
    <line class="grid" x1="207" y1="20" x2="207" y2="216"/>
    <line class="axis" x1="50" y1="216" x2="364" y2="216"/>
    <line class="axis" x1="50" y1="20" x2="50" y2="216"/>
    <line class="diag" x1="50" y1="216" x2="364" y2="20"/>

    <!-- Scatter: brick-red points around diagonal, slightly wider spread below -->
    <g fill="#C44536">
      <circle cx="66" cy="211" r="3"/>
      <circle cx="81" cy="188" r="3"/>
      <circle cx="97" cy="199" r="3"/>
      <circle cx="113" cy="172" r="3"/>
      <circle cx="129" cy="182" r="3"/>
      <circle cx="144" cy="147" r="3"/>
      <circle cx="160" cy="155" r="3"/>
      <circle cx="176" cy="123" r="3"/>
      <circle cx="191" cy="148" r="3"/>
      <circle cx="207" cy="113" r="3"/>
      <circle cx="223" cy="120" r="3"/>
      <circle cx="238" cy="80" r="3"/>
      <circle cx="254" cy="114" r="3"/>
      <circle cx="270" cy="69" r="3"/>
      <circle cx="286" cy="87" r="3"/>
      <circle cx="301" cy="37" r="3"/>
      <circle cx="317" cy="59" r="3"/>
      <circle cx="326" cy="36" r="3"/>
      <circle cx="336" cy="44" r="3"/>
      <circle cx="351" cy="31" r="3"/>
    </g>

    <!-- X-axis tick labels -->
    <g class="label-mono mute" font-size="10" text-anchor="middle">
      <text x="50" y="232">0</text>
      <text x="207" y="232">0.5</text>
      <text x="364" y="232">1.0</text>
    </g>

    <!-- Y-axis tick labels -->
    <g class="label-mono mute" font-size="10" text-anchor="end">
      <text x="42" y="220">0</text>
      <text x="42" y="122">0.5</text>
      <text x="42" y="24">1.0</text>
    </g>

    <!-- Axis titles -->
    <text class="label-sans mute" x="207" y="252" font-size="12" text-anchor="middle">真实值 (True)</text>
    <text class="label-sans mute" x="14" y="118" font-size="12" text-anchor="middle" transform="rotate(-90 14 118)">预测值 (Predicted)</text>

    <!-- R² annotation, top-right of plot -->
    <g transform="translate(286 6)">
      <rect x="0" y="0" width="72" height="22" fill="#FAFAF7" stroke="#2E5C8A" stroke-width="1" rx="4" ry="4"/>
      <text class="label-mono primary" x="36" y="15" font-size="11" text-anchor="middle">R² ≈ 0.89</text>
    </g>
  </g>

  <!-- Bottom meta line -->
  <text class="label-mono mute" x="56" y="338" font-size="12">TF 2.21 · sklearn 1.8 · 作者 liem</text>
</svg>