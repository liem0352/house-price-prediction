<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" role="img" aria-labelledby="rpTitle rpDesc">
  <title id="rpTitle">残差分布图 — 系统性偏差检验</title>
  <desc id="rpDesc">残差散点图。横轴为预测房价(归一化 0-1),纵轴为残差(预测减真实,范围约 -0.3 到 0.3)。深蓝实线为零线(残差=0),砖红散点围绕零线随机分布,无明显趋势或喇叭形,表明模型无系统性偏差。</desc>
  <defs>
    <style>
      .bg { fill: #FAFAF7; }
      .ink { fill: #1A1A1A; }
      .mute { fill: #8B8680; }
      .primary { fill: #2E5C8A; }
      .accent { fill: #C44536; }
      .frame { fill: #FFFFFF; stroke: #E5E2DC; stroke-width: 1; }
      .axis { stroke: #8B8680; stroke-width: 1; }
      .grid { stroke: #EDE9E2; stroke-width: 1; stroke-dasharray: 2 4; }
      .zero-line { stroke: #2E5C8A; stroke-width: 1.8; }
      .label-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .label-sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1200" height="280" rx="20" ry="20"/>

  <!-- Header -->
  <g transform="translate(56 32)">
    <text class="label-mono mute" x="0" y="0" font-size="11" letter-spacing="1.5">RESIDUAL PLOT · BIAS CHECK</text>
    <text class="label-sans ink" x="0" y="26" font-size="20" font-weight="700">残差分布 — 系统性偏差检验</text>
    <text class="label-sans mute" x="0" y="46" font-size="12">残差围绕零线随机分布,无明显趋势即模型无系统性偏差</text>
  </g>

  <!-- Mean residual badge top-right -->
  <g transform="translate(1010 32)">
    <rect x="0" y="0" width="134" height="22" fill="#FAFAF7" stroke="#2E5C8A" stroke-width="1" rx="4" ry="4"/>
    <text class="label-mono primary" x="67" y="15" font-size="11" text-anchor="middle" font-weight="600">均值 ≈ 0.002</text>
  </g>

  <!-- Residual plot area -->
  <g transform="translate(56 96)">
    <rect class="frame" x="0" y="0" width="1088" height="140" rx="8" ry="8"/>

    <!-- Grid lines (horizontal) at residual = -0.3, -0.15, 0, 0.15, 0.3 -->
    <!-- y mapping: 0.3 -> y=14, 0.15 -> y=49, 0 -> y=84, -0.15 -> y=119, -0.3 -> y=154 -->
    <!-- But plot height is 140, so adjust: top y=10, bottom y=130, zero y=70 -->
    <line class="grid" x1="60" y1="20" x2="1048" y2="20"/>
    <line class="grid" x1="60" y1="50" x2="1048" y2="50"/>
    <line class="grid" x1="60" y1="100" x2="1048" y2="100"/>
    <line class="grid" x1="60" y1="130" x2="1048" y2="130"/>

    <!-- Grid lines (vertical) -->
    <line class="grid" x1="316" y1="10" x2="316" y2="130"/>
    <line class="grid" x1="572" y1="10" x2="572" y2="130"/>
    <line class="grid" x1="828" y1="10" x2="828" y2="130"/>

    <!-- Axes -->
    <line class="axis" x1="60" y1="130" x2="1048" y2="130"/>
    <line class="axis" x1="60" y1="10" x2="60" y2="130"/>

    <!-- Zero residual line (deep blue, thicker) -->
    <line class="zero-line" x1="60" y1="70" x2="1048" y2="70"/>

    <!-- Residual scatter: brick-red points scattered around zero line -->
    <g fill="#C44536" fill-opacity="0.68">
      <!-- Low prediction range -->
      <circle cx="90" cy="76" r="3"/>
      <circle cx="110" cy="64" r="3"/>
      <circle cx="130" cy="78" r="3"/>
      <circle cx="150" cy="62" r="3"/>
      <circle cx="170" cy="72" r="3"/>
      <circle cx="190" cy="58" r="3"/>
      <circle cx="210" cy="80" r="3"/>
      <circle cx="230" cy="66" r="3"/>
      <circle cx="250" cy="74" r="3"/>
      <circle cx="270" cy="60" r="3"/>
      <!-- Low-mid -->
      <circle cx="290" cy="78" r="3"/>
      <circle cx="310" cy="64" r="3"/>
      <circle cx="330" cy="82" r="3"/>
      <circle cx="350" cy="58" r="3"/>
      <circle cx="370" cy="70" r="3"/>
      <circle cx="390" cy="76" r="3"/>
      <circle cx="410" cy="62" r="3"/>
      <circle cx="430" cy="80" r="3"/>
      <circle cx="450" cy="68" r="3"/>
      <circle cx="470" cy="74" r="3"/>
      <!-- Mid -->
      <circle cx="490" cy="60" r="3"/>
      <circle cx="510" cy="78" r="3"/>
      <circle cx="530" cy="66" r="3"/>
      <circle cx="550" cy="72" r="3"/>
      <circle cx="570" cy="58" r="3"/>
      <circle cx="590" cy="80" r="3"/>
      <circle cx="610" cy="64" r="3"/>
      <circle cx="630" cy="76" r="3"/>
      <circle cx="650" cy="62" r="3"/>
      <circle cx="670" cy="70" r="3"/>
      <!-- Mid-high -->
      <circle cx="690" cy="78" r="3"/>
      <circle cx="710" cy="60" r="3"/>
      <circle cx="730" cy="74" r="3"/>
      <circle cx="750" cy="66" r="3"/>
      <circle cx="770" cy="80" r="3"/>
      <circle cx="790" cy="58" r="3"/>
      <circle cx="810" cy="72" r="3"/>
      <circle cx="830" cy="64" r="3"/>
      <circle cx="850" cy="78" r="3"/>
      <circle cx="870" cy="62" r="3"/>
      <!-- High -->
      <circle cx="890" cy="76" r="3"/>
      <circle cx="910" cy="68" r="3"/>
      <circle cx="930" cy="80" r="3"/>
      <circle cx="950" cy="60" r="3"/>
      <circle cx="970" cy="74" r="3"/>
      <circle cx="990" cy="66" r="3"/>
      <circle cx="1010" cy="78" r="3"/>
      <circle cx="1030" cy="62" r="3"/>
      <!-- A few outliers -->
      <circle cx="380" cy="42" r="3"/>
      <circle cx="620" cy="98" r="3"/>
      <circle cx="780" cy="40" r="3"/>
      <circle cx="280" cy="100" r="3"/>
      <circle cx="900" cy="44" r="3"/>
    </g>

    <!-- X-axis tick labels -->
    <g class="label-mono mute" font-size="10" text-anchor="middle">
      <text x="60" y="146">0.0</text>
      <text x="316" y="146">0.25</text>
      <text x="572" y="146">0.50</text>
      <text x="828" y="146">0.75</text>
      <text x="1048" y="146">1.0</text>
    </g>

    <!-- Y-axis tick labels -->
    <g class="label-mono mute" font-size="10" text-anchor="end">
      <text x="54" y="24">+0.3</text>
      <text x="54" y="54">+0.15</text>
      <text x="54" y="74" font-weight="600" fill="#2E5C8A">0</text>
      <text x="54" y="104">-0.15</text>
      <text x="54" y="134">-0.3</text>
    </g>

    <!-- Axis titles -->
    <text class="label-sans mute" x="554" y="166" font-size="11" text-anchor="middle">预测房价 (Predicted, normalized)</text>
    <text class="label-sans mute" x="16" y="70" font-size="11" text-anchor="middle" transform="rotate(-90 16 70)">残差 (Predicted - True)</text>

    <!-- Zero line label -->
    <text class="label-mono primary" x="1042" y="66" font-size="10" text-anchor="end" font-weight="600">residual = 0</text>
  </g>

  <!-- Bottom note -->
  <text class="label-mono mute" x="56" y="268" font-size="10">实际产物: figures/residuals.png · 残差近似零均值且无喇叭形,表明模型无系统性偏差与异方差</text>
</svg>
