<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" role="img" aria-labelledby="tuTitle tuDesc">
  <title id="tuTitle">快速开始 — 安装依赖与运行命令</title>
  <desc id="tuDesc">终端命令卡片,展示完整快速开始流程:第一步安装依赖(pip install tensorflow pandas numpy scikit-learn matplotlib),第二步打开 Jupyter notebook 执行主实验。提示符为砖红色,命令为深色等宽字体,注释为静音灰。</desc>
  <defs>
    <style>
      .bg { fill: #FAFAF7; }
      .ink { fill: #1A1A1A; }
      .mute { fill: #8B8680; }
      .primary { fill: #2E5C8A; }
      .accent { fill: #C44536; }
      .terminal-frame { fill: #FFFFFF; stroke: #E5E2DC; stroke-width: 1; }
      .terminal-bar { fill: #F5F2EC; }
      .label-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .label-sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1200" height="200" rx="16" ry="16"/>

  <!-- Header -->
  <g transform="translate(56 30)">
    <text class="label-mono mute" x="0" y="0" font-size="11" letter-spacing="1.5">QUICK START · COMMANDS</text>
    <text class="label-sans ink" x="0" y="22" font-size="18" font-weight="700">两步完成安装与运行</text>
  </g>

  <!-- Environment badge top-right -->
  <g transform="translate(1010 30)">
    <rect x="0" y="0" width="134" height="22" fill="#FAFAF7" stroke="#2E5C8A" stroke-width="1" rx="4" ry="4"/>
    <text class="label-mono primary" x="67" y="15" font-size="10" text-anchor="middle" font-weight="600">Python 3.13 · TF 2.21</text>
  </g>

  <!-- Terminal window -->
  <g transform="translate(56 78)">
    <rect class="terminal-frame" x="0" y="0" width="1088" height="100" rx="8" ry="8"/>

    <!-- Title bar -->
    <rect class="terminal-bar" x="0" y="0" width="1088" height="22" rx="8" ry="8"/>
    <rect class="terminal-bar" x="0" y="14" width="1088" height="8"/>
    <text class="label-mono mute" x="14" y="15" font-size="10" letter-spacing="1">bash · quickstart.sh</text>
    <line x1="0" y1="22" x2="1088" y2="22" stroke="#E5E2DC" stroke-width="1"/>

    <!-- Command 1: install -->
    <g transform="translate(14 40)">
      <text class="label-mono accent" x="0" y="0" font-size="12" font-weight="600">$</text>
      <text class="label-mono ink" x="14" y="0" font-size="12">pip install tensorflow pandas numpy scikit-learn matplotlib</text>
    </g>
    <text class="label-mono mute" x="28" y="18" font-size="10"># 安装深度学习与数据处理依赖</text>

    <!-- Command 2: run notebook -->
    <g transform="translate(14 70)">
      <text class="label-mono accent" x="0" y="0" font-size="12" font-weight="600">$</text>
      <text class="label-mono ink" x="14" y="0" font-size="12">jupyter notebook skill_test/神经网络模型实现_房价预测.ipynb</text>
    </g>
    <text class="label-mono mute" x="28" y="18" font-size="10"># 打开主实验 notebook,按单元格顺序执行</text>
  </g>

  <!-- Bottom note -->
  <text class="label-mono mute" x="56" y="194" font-size="10">完整流程: 预处理 → 训练 → 评估 → 出图 → 保存 house_price_model.keras</text>
</svg>
